name: Python品質チェック

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-format-check:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: |
          pip install -r requirements.txt

      - name: 比較対象コミットを決定
        id: changed_refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM_REF="${{ github.event.pull_request.base.sha }}"
            TO_REF="${{ github.event.pull_request.head.sha }}"
          else
            BEFORE_REF="${{ github.event.before }}"
            TO_REF="${{ github.sha }}"
            ZERO_SHA="0000000000000000000000000000000000000000"

            if [ -z "${BEFORE_REF}" ] || [ "${BEFORE_REF}" = "${ZERO_SHA}" ]; then
              if git rev-parse "${TO_REF}^" >/dev/null 2>&1; then
                FROM_REF="$(git rev-parse "${TO_REF}^")"
              else
                FROM_REF="${TO_REF}"
              fi
            else
              FROM_REF="${BEFORE_REF}"
            fi
          fi

          echo "from_ref=${FROM_REF}" >> "${GITHUB_OUTPUT}"
          echo "to_ref=${TO_REF}" >> "${GITHUB_OUTPUT}"
          echo "比較範囲: ${FROM_REF}..${TO_REF}"

      - name: pre-commitチェック
        run: |
          ./scripts/run_quality_checks.sh \
            "${{ steps.changed_refs.outputs.from_ref }}" \
            "${{ steps.changed_refs.outputs.to_ref }}"
