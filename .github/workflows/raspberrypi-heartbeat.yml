name: RaspberryPi ハートビート監視

on:
  # schedule:
    # - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raspberrypi-heartbeat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install requests google-auth

      - name: ハートビートを確認
        env:
          GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
          GOOGLE_SA_PRIVATE_KEY_ID: ${{ secrets.GOOGLE_SA_PRIVATE_KEY_ID }}
          GOOGLE_SA_PROJECT_ID: ${{ secrets.GOOGLE_SA_PROJECT_ID }}
          GOOGLE_SA_CLIENT_EMAIL: ${{ secrets.GOOGLE_SA_CLIENT_EMAIL }}
          GOOGLE_SA_CLIENT_ID: ${{ secrets.GOOGLE_SA_CLIENT_ID }}
          FIREBASE_REGISTRATION_TOKENS: ${{ secrets.FIREBASE_REGISTRATION_TOKENS }}
          HEARTBEAT_TIMEOUT_MINUTES: ${{ vars.HEARTBEAT_TIMEOUT_MINUTES || '30' }}
        run: |
          # raspberrypi-image と同じ分離Secretsからサービスアカウント JSON を組み立てる
          umask 077
          key_file="$RUNNER_TEMP/google-service-account.json"
          jq -n '{
            type: "service_account",
            project_id: env.GOOGLE_SA_PROJECT_ID,
            private_key_id: env.GOOGLE_SA_PRIVATE_KEY_ID,
            private_key: env.GOOGLE_SA_PRIVATE_KEY,
            client_email: env.GOOGLE_SA_CLIENT_EMAIL,
            client_id: env.GOOGLE_SA_CLIENT_ID,
            auth_uri: "https://accounts.google.com/o/oauth2/auth",
            token_uri: "https://oauth2.googleapis.com/token",
            universe_domain: "googleapis.com"
          }' > "$key_file"
          FIREBASE_CREDENTIALS_FILE="$key_file" \
          FIREBASE_PROJECT_ID="$GOOGLE_SA_PROJECT_ID" \
          python scripts/check_heartbeat.py
