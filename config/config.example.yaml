# WiFi接続通知ツール 設定ファイル

# =====================================================================
# 検出方式の選択
# =====================================================================
# "arp"    : ARPスキャンによるローカルネットワーク監視（Raspberry Pi向け）
#            ルータへの管理者アクセスが不要です。root権限が必要です。
# "router" : ルータ管理画面のAPIを使用した接続監視（GitHub Actions向け）
#            ルータの管理者パスワードが必要です。
detection_method: "arp"

# =====================================================================
# ARPスキャン設定（detection_method が "arp" の場合に使用）
# =====================================================================
arp:
  # スキャン対象のサブネット（CIDR表記）
  # 省略した場合はホストのIPアドレスから自動検出します（推奨）
  # subnet: "192.168.1.0/24"

  # 使用するネットワークインターフェース名
  # 省略した場合はscapyがデフォルトを使用します
  # Raspberry Pi Zero 2 W の WiFiインターフェースは通常 "wlan0" です
  # interface: "wlan0"

  # ARPレスポンスの待機時間（秒）
  timeout: 2

# =====================================================================
# ルータ設定（detection_method が "router" の場合に使用）
# =====================================================================
# router:
#   ip: "192.168.10.1"           # ルータのIPアドレス
#   username: "admin"             # 管理者ユーザー名
#   password: "your_router_password"  # 管理者パスワード

# メール設定
email:
  smtp_server: "smtp.gmail.com"     # SMTPサーバーアドレス
  smtp_port: 587                     # SMTPポート番号
  smtp_user: "your_email@gmail.com"  # SMTP認証ユーザー名
  smtp_password: "your_app_password" # SMTP認証パスワード（Gmailの場合はアプリパスワード）
  sender_email: "your_email@gmail.com"  # 送信元メールアドレス
  recipient_emails:                  # 受信者メールアドレスのリスト
    - "notify_recipient@example.com"
  use_tls: true                      # TLS暗号化を使用するか

# 監視対象デバイス（MACアドレスのリスト）
# 空の場合は全ての新規接続を通知
monitored_devices:
  - "AA:BB:CC:DD:EE:FF"

# チェック間隔（秒）
check_interval: 60

# ログレベル（DEBUG, INFO, WARNING, ERROR, CRITICAL）
log_level: "INFO"

# ログファイル名
log_file: "wifi_notifier.log"
